<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#eceff3;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const P = new URLSearchParams(location.search);
const W = +(P.get('w') || 420), H = +(P.get('h') || 560);
const VIEWS = (P.get('views') || 'front,threequarter,side,back').split(',');
const HEADONLY = P.get('head') === '1';

const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(2);
renderer.setSize(W * VIEWS.length, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeceff3);

// Soft three-point studio lighting so flat colours still read as solid form.
scene.add(new THREE.HemisphereLight(0xffffff, 0xb9c0cc, 1.05));
const key = new THREE.DirectionalLight(0xffffff, 1.55);
key.position.set(3, 6, 5); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5; key.shadow.camera.far = 40;
key.shadow.camera.left = -6; key.shadow.camera.right = 6;
key.shadow.camera.top = 8; key.shadow.camera.bottom = -2;
key.shadow.bias = -0.0012;
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.42); fill.position.set(-5, 3, 4); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 0.55); rim.position.set(0, 4, -7); scene.add(rim);

const root = new THREE.Group();
scene.add(root);

const loader = new GLTFLoader();
loader.load(P.get('src'), (gltf) => {
  const obj = gltf.scene;
  obj.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true; o.receiveShadow = true;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m => { if (m) { m.side = THREE.DoubleSide; m.shadowSide = THREE.FrontSide; } });
    }
  });
  root.add(obj);

  // Re-centre the model on the origin and drop its feet to y=0.
  const box = new THREE.Box3().setFromObject(obj);
  const c = box.getCenter(new THREE.Vector3());
  obj.position.sub(new THREE.Vector3(c.x, box.min.y, c.z));

  const b2 = new THREE.Box3().setFromObject(root);
  const size = b2.getSize(new THREE.Vector3());
  const height = size.y;

  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(Math.max(size.x, size.z) * 2.6, 64),
    new THREE.ShadowMaterial({opacity: 0.19}));
  ground.rotation.x = -Math.PI / 2; ground.position.y = 0.002; ground.receiveShadow = true;
  scene.add(ground);

  // Model faces -Z, so the camera looks from -Z for a front view.
  // The model faces +Z, so the front view sits on +Z.
  const ANG = {front: 0, threequarter: Math.PI * 0.22, side: Math.PI / 2,
               back: Math.PI, threequarter_l: -Math.PI * 0.22};

  let target, radius;
  if (HEADONLY) {
    const headY = b2.min.y + height * 0.845;
    target = new THREE.Vector3(0, headY, 0);
    radius = height * 0.30;
  } else {
    target = new THREE.Vector3(0, b2.min.y + height * 0.52, 0);
    radius = height * 0.92;
  }

  const aspect = W / H;
  VIEWS.forEach((v, i) => {
    const a = ANG[v] !== undefined ? ANG[v] : Math.PI;
    const cam = new THREE.OrthographicCamera(
      -radius * aspect, radius * aspect, radius, -radius, 0.01, 200);
    const dist = height * 3.2;
    cam.position.set(target.x + Math.sin(a) * dist,
                     target.y + (HEADONLY ? height * 0.03 : height * 0.10),
                     target.z + Math.cos(a) * dist);
    cam.lookAt(target);
    renderer.setViewport(i * W, 0, W, H);
    renderer.setScissor(i * W, 0, W, H);
    renderer.setScissorTest(true);
    renderer.render(scene, cam);
  });

  window.__READY__ = true;
}, undefined, (e) => { window.__ERROR__ = String(e); window.__READY__ = true; });
</script>
